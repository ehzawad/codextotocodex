name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  # Never cancel mid-run: a cancelled run that already deleted the old release
  # leaves /releases/latest/download/ 404ing until the next successful publish.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to 22.04 — PyInstaller bakes in the host glibc, and ubuntu-latest
          # (currently 24.04) produces binaries that won't run on older distros.
          - { runs-on: ubuntu-22.04, target: linux-x86_64 }
          - { runs-on: macos-14,    target: darwin-arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build binary + tarball
        run: |
          pip install pyinstaller -e .
          pyinstaller --name codex-chronicle --onedir --clean --noupx codex_chronicle/_entrypoint.py
          mv dist/codex-chronicle "codex-chronicle-${{ matrix.target }}"
          tar -czf "codex-chronicle-${{ matrix.target }}.tar.gz" "codex-chronicle-${{ matrix.target }}"
          shasum -a 256 "codex-chronicle-${{ matrix.target }}.tar.gz" > "codex-chronicle-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: codex-chronicle-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rolling release — delete all old, publish one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          # Wipe every existing release + its git tag. "Keep only the latest"
          # means exactly one release at a time — no drift across versions.
          # --limit 1000 because `gh release list` defaults to 30.
          for t in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            gh release delete "$t" --yes --cleanup-tag
          done
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --latest \
            --notes "Rolling release for $GITHUB_SHA"
